name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  editor-references:
    name: Editor grammar references
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/tree-sitter-ss/package-lock.json

      - name: Test Zed extension generation and grammar references
        run: |
          python3 tests/editor/zed/reference/spec.py
          python3 tests/editor/zed/generation/spec.py

      - name: Test tree-sitter grammar and editor queries
        working-directory: editor/tree-sitter-ss
        run: |
          npm ci
          npm test

      - name: Check generated grammar sources
        run: git diff --exit-code -- editor/tree-sitter-ss/src

  test:
    name: Zig 0.17 build test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ libcairo2-dev libgdk-pixbuf-2.0-dev librsvg2-dev \
            libpango1.0-dev libqpdf-dev pkg-config qpdf

      - name: Set up Zig
        uses: ./.github/actions/setup-zig

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/vscode/package-lock.json

      - name: Install VS Code extension packages
        working-directory: editor/vscode
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: third_party/fontawesome-free/tools/requirements.txt

      - name: Install Font Awesome metadata generator dependencies
        run: python -m pip install --requirement third_party/fontawesome-free/tools/requirements.txt

      - name: Show tool versions
        run: |
          zig version
          node --version
          npm --version
          pkg-config --modversion cairo
          pkg-config --modversion pangocairo
          pkg-config --modversion librsvg-2.0
          pkg-config --modversion libqpdf

      - name: Check bundled tree-sitter language metadata
        run: node third_party/tree-sitter-languages/tools/update.mjs --check

      - name: Check Font Awesome category metadata
        run: python third_party/fontawesome-free/tools/update-categories.py --check

      - name: Check release metadata
        run: |
          release/tools/preflight.py
          python3 tests/release/release_tools_spec.py
          python3 tests/release/notes_spec.py
          python3 tests/release/vscode/spec.py

      - name: Run tests
        run: zig build test

      - name: Package and validate VS Code extension
        working-directory: editor/vscode
        run: |
          mkdir -p ../../.test-tmp/vscode-package
          npm run package:compiled -- --out ../../.test-tmp/vscode-package/ss-language-support.vsix --allow-missing-repository --skip-license
          python3 ../../release/tools/check-vscode-package.py ../../.test-tmp/vscode-package/ss-language-support.vsix

      - name: Test bundled MD4C fork
        run: python3 third_party/tools/md4c/test.py

      - name: Build ss binary
        run: zig build

      - name: Run project and LSP smoke tests
        run: |
          tests/smoke/project.sh
          node tests/smoke/lsp.mjs

  qpdf-compatibility:
    name: Native PDF macOS 15 ARM64, Homebrew packages
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Zig
        uses: ./.github/actions/setup-zig

      - name: Install PDF dependencies
        run: brew install cairo pango librsvg qpdf pkg-config

      - name: Test PDF backend
        run: zig build test-render-pdf --summary all
