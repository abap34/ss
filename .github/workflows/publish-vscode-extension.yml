name: Publish VS Code extension

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  publish-vscode:
    name: Validate, package, and publish VSIX
    if: ${{ !contains(inputs.tag || github.ref_name, '-patch.') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select tagged release sources
        run: |
          cp release/tools/check-vscode-package.py "$RUNNER_TEMP/check-vscode-package.py"
          python3 release/tools/prepare-vscode-publication.py "$RELEASE_TAG"

      - name: Check release metadata
        run: release/tools/preflight.py "$RELEASE_TAG"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            editor/vscode/package-lock.json
            editor/tree-sitter-ss/package-lock.json

      - name: Install VS Code extension packages
        working-directory: editor/vscode
        run: npm ci

      - name: Test tree-sitter grammar
        working-directory: editor/tree-sitter-ss
        run: |
          npm ci
          npm test

      - name: Package VS Code extension
        working-directory: editor/vscode
        run: |
          npm run package -- --out "ss-language-support-${RELEASE_TAG}.vsix" --allow-missing-repository --skip-license
          python3 "$RUNNER_TEMP/check-vscode-package.py" "ss-language-support-${RELEASE_TAG}.vsix" --extension-root . --version "${RELEASE_TAG#v}"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ss-language-support-vsix
          path: editor/vscode/ss-language-support-${{ env.RELEASE_TAG }}.vsix

      - name: Publish to Marketplace
        working-directory: editor/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "${VSCE_PAT:-}" ]; then
            npx vsce publish --packagePath "ss-language-support-${RELEASE_TAG}.vsix" -p "$VSCE_PAT" --allow-missing-repository --skip-license
          else
            echo "VSCE_PAT is not configured; skipping Marketplace publish."
          fi

      - name: Attach VSIX to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ env.RELEASE_TAG }}
          VSIX: editor/vscode/ss-language-support-${{ env.RELEASE_TAG }}.vsix
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if gh release view "$TAG_NAME" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "release $TAG_NAME was not created by the source archive workflow" >&2
              exit 1
            fi
            sleep 10
          done
          gh release upload "$TAG_NAME" "$VSIX" --clobber
