name: Publish VS Code extension

on:
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string
    secrets:
      VSCE_PAT:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: vscode-publication-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  publish-vscode:
    name: Validate, package, and publish VSIX
    if: ${{ !contains(inputs.tag, '-patch.') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out publication tools
        uses: actions/checkout@v6
        with:
          sparse-checkout: release/tools

      - name: Keep the current package verifier
        run: cp release/tools/check-vscode-package.py "$RUNNER_TEMP/check-vscode-package.py"

      - name: Check out tagged release sources
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Check release metadata
        run: |
          release/tools/release_versions.py validate-tag "$RELEASE_TAG"
          release/tools/preflight.py "$RELEASE_TAG"

      - name: Check that the GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "$RELEASE_TAG" > /dev/null

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/vscode/package-lock.json

      - name: Install VS Code extension packages
        working-directory: editor/vscode
        run: npm ci

      - name: Package VS Code extension
        working-directory: editor/vscode
        run: |
          npm run package -- --out "ss-language-support-${RELEASE_TAG}.vsix" --allow-missing-repository --skip-license
          python3 "$RUNNER_TEMP/check-vscode-package.py" "ss-language-support-${RELEASE_TAG}.vsix" --extension-root . --version "${RELEASE_TAG#v}"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ss-language-support-vsix
          path: editor/vscode/ss-language-support-${{ env.RELEASE_TAG }}.vsix

      - name: Publish to Marketplace
        working-directory: editor/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "${VSCE_PAT:-}" ]; then
            npx vsce publish --packagePath "ss-language-support-${RELEASE_TAG}.vsix" -p "$VSCE_PAT" --allow-missing-repository --skip-license
          else
            echo "VSCE_PAT is not configured; skipping Marketplace publish."
          fi

      - name: Attach VSIX to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ env.RELEASE_TAG }}
          VSIX: editor/vscode/ss-language-support-${{ env.RELEASE_TAG }}.vsix
        run: gh release upload "$TAG_NAME" "$VSIX" --clobber
