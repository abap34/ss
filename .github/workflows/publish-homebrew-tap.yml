name: Publish release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  HOMEBREW_TAP_REPO: abap34/homebrew-ss
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  compatibility:
    uses: ./.github/workflows/pdf-compatibility.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}

  source:
    name: Create release and source archive
    needs: compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
      source_url: ${{ steps.source.outputs.source_url }}
      source_sha256: ${{ steps.source.outputs.source_sha256 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Check release metadata
        run: release/tools/preflight.py "$RELEASE_TAG"

      - name: Create release and source archive
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_tag="$RELEASE_TAG"
          release/tools/release_versions.py validate-tag "$release_tag"
          version="$(release/tools/release_versions.py version "$release_tag")"
          archive="ss-${version}.tar.gz"
          commit="$(git rev-parse HEAD)"
          git archive --format=tar --prefix="ss-${version}/" "$commit" | gzip -n > "$archive"
          sha256="$(sha256sum "$archive" | awk '{print $1}')"
          source_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}/${archive}"

          if ! gh release view "$release_tag" >/dev/null 2>&1; then
            release/tools/changelog-section.py "$release_tag" > release-notes.md
            gh release create "$release_tag" --verify-tag --title "ss ${release_tag}" --notes-file release-notes.md
          fi
          gh release upload "$release_tag" "$archive" --clobber

          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_url=$source_url" >> "$GITHUB_OUTPUT"
          echo "source_sha256=$sha256" >> "$GITHUB_OUTPUT"

  homebrew:
    name: Update Homebrew tap
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out released sources
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.commit }}

      - name: Render Homebrew formula
        id: formula
        run: |
          set -euo pipefail
          version="${{ needs.source.outputs.version }}"
          formula_name="$(release/tools/release_versions.py homebrew-formula-name "$version")"
          formula_path="$RUNNER_TEMP/homebrew/${formula_name}.rb"
          release/tools/render-homebrew-formula.py \
            --version "$version" \
            --source-url "${{ needs.source.outputs.source_url }}" \
            --source-sha256 "${{ needs.source.outputs.source_sha256 }}" \
            --formula-name "$formula_name" \
            --output "$formula_path"
          ruby -c "$formula_path"
          echo "formula_name=$formula_name" >> "$GITHUB_OUTPUT"
          echo "formula_path=$formula_path" >> "$GITHUB_OUTPUT"

      - name: Upload formula artifact
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: ${{ steps.formula.outputs.formula_path }}
          if-no-files-found: error

      - name: Update tap repository
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN is not configured; skipping tap update."
            exit 0
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${HOMEBREW_TAP_REPO}.git" tap
          mkdir -p tap/Formula
          cp "${{ steps.formula.outputs.formula_path }}" "tap/Formula/${{ steps.formula.outputs.formula_name }}.rb"

          cd tap
          git add "Formula/${{ steps.formula.outputs.formula_name }}.rb"
          if git diff --cached --quiet -- "Formula/${{ steps.formula.outputs.formula_name }}.rb"; then
            echo "Formula/${{ steps.formula.outputs.formula_name }}.rb is already up to date."
            exit 0
          fi
          git commit -m "ss ${RELEASE_TAG}"
          git push origin HEAD:main

  vscode:
    name: Publish VS Code extension
    needs: source
    if: ${{ !contains(needs.source.outputs.version, '-patch.') }}
    uses: ./.github/workflows/publish-vscode-extension.yml
    permissions:
      contents: write
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
